settings:
  # Mode can be: simulation, staging, production
  env_mode: "simulation"
  
  # SQLite Database Path
  database_path: "orchestrator.db"
  
  # LLM settings
  llm_provider: "groq"
  llm_model: "llama-3.3-70b-versatile"
  
  # Default fallback context parameters
  default_context:
    address_id: "addr_home_001"
    lat: 12.9716
    lng: 77.5946
    time_of_day: "19:30"
    hunger_level: "high"

# LLM Client Configuration
llm:
  enabled: true
  provider: groq               # Primary LLM provider: "groq", "gemini", or "xai"
  model: llama-3.3-70b-versatile  # Groq: llama-3.3-70b-versatile | Gemini: gemini-2.5-flash | xAI: grok-3-mini
  fallback_provider: gemini    # Secondary provider for automatic failover on rate limits / errors
  # api_key is read automatically from GROQ_API_KEY, GEMINI_API_KEY, or XAI_API_KEY in .env

# MCP Server URLs (Swiggy gateway)
mcp_servers:
  food: "https://mcp.swiggy.com/servers/food"
  instamart: "https://mcp.swiggy.com/servers/instamart"
  dineout: "https://mcp.swiggy.com/servers/dineout"

db_path: orchestrator.db
